name: b1_test_app
description: Police B1 Test offline exam practice, balanced exams and spaced repetition.
publish_to: 'none'
version: 1.0.3+6

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  file_picker: ^13.1.0
  archive: ^4.3.0
  intl: ^0.20.2
  google_mobile_ads: ^9.1.0
  krutidevtounicode: ^1.0.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/privacy_policy.txt
    - assets/sample_bns_10.json
    - assets/preloaded/
    - assets/additional/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/police_b1_icon.png
  adaptive_icon_background: '#0D2342'
  adaptive_icon_foreground: assets/brand/police_b1_icon.png
