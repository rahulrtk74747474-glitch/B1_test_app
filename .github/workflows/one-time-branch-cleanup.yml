name: One-time approved branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-branch-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'rahulrtk74747474-glitch/B1_test_app'
    runs-on: ubuntu-latest
    steps:
      - name: Delete approved non-main branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failed=0
          branches=(
            'feature/custom-count-topic-tap'
            'feature/direct-count-ads-quiz'
            'feature/fix-revision-live-counts'
            'feature/fix-test-ad-transitions'
            'feature/fix-ui-progress-hindi-add-6496'
            'feature/optional-donations-upi-binance-contact'
            'feature/optional-support-donations'
            'feature/playstore-admob-release'
            'feature/police-b1-balanced-exams'
            'feature/police-b1-final-optional-donations'
            'feature/policy-safe-fixed-ad-layout'
            'feature/pretest-ads-rating-practice'
            'feature/revision-ratings-live-sync'
            'feature/sticky-banners-rewarded-milestones'
            'feature/study-stars-rewarded-ads'
            'feature/test-count-dialog-results-ads'
            'feature/zip-image-question-banks'
          )
          for branch in "${branches[@]}"; do
            echo "Deleting $branch"
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"; then
              echo "Deleted $branch"
            else
              echo "FAILED $branch" >&2
              failed=$((failed+1))
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "$failed branch deletion(s) failed" >&2
            exit 1
          fi
          echo 'All 17 approved branches deleted; main retained.'
