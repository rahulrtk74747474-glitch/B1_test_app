name: Flutter Android CI

on:
  push:
    branches: [main, feature/police-b1-balanced-exams]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffold
        run: |
          flutter create --empty --platforms=android --project-name b1_test_app .
          rm -f test/widget_test.dart
      - name: Set app name and generate branded launcher icon
        run: |
          python3 -m pip install --user Pillow
          python3 tools/generate_icon.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text().replace('android:label="b1_test_app"', 'android:label="Police B1 Test"')
          p.write_text(text)
          PY
      - run: flutter pub get
      - name: Apply launcher icon
        run: dart run flutter_launcher_icons
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Validate bundled B1 question bank
        run: python3 tools/validate_preloaded.py
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: b1-test-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
